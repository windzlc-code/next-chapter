<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InFinio Dev Warmup</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #090b11;
        color: #f8fafc;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family:
          "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background:
          radial-gradient(circle at top, rgba(124, 146, 255, 0.18), transparent 42%),
          linear-gradient(180deg, #0b0d13 0%, #090b11 100%);
      }

      .card {
        width: min(420px, calc(100vw - 48px));
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.04);
        padding: 28px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
        backdrop-filter: blur(20px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: rgba(226, 232, 240, 0.92);
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.22em;
      }

      .brand::before {
        content: "";
        width: 12px;
        height: 12px;
        border-radius: 999px;
        background: #7c92ff;
        animation: pulse 1.8s ease-in-out infinite;
      }

      h1 {
        margin: 20px 0 0;
        font-size: 26px;
        line-height: 1.25;
      }

      p {
        margin: 12px 0 0;
        font-size: 14px;
        line-height: 1.8;
        color: #cbd5e1;
      }

      .progress {
        margin-top: 24px;
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }

      .progress::after {
        content: "";
        display: block;
        width: 32%;
        height: 100%;
        border-radius: 999px;
        background: #7c92ff;
        animation: progress 1.8s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.92);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes progress {
        0% {
          transform: translateX(-10%);
        }
        50% {
          transform: translateX(120%);
        }
        100% {
          transform: translateX(240%);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">INFINIO</div>
      <h1>正在准备开发工作台</h1>
      <p>本地 Vite 服务正在预热，窗口会在准备完成后自动切换到应用。</p>
      <div class="progress"></div>
    </div>
  </body>
</html>
